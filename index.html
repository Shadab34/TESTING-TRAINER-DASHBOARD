<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CarWale NHT Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--panel:#ffffff;--card:#f8fbfd;--border:#d1dce6;--border2:#b8c5d6;
  --accent:#1e88e5;--green:#00c853;--red:#d32f2f;--purple:#7c4dff;
  --yellow:#fbc02d;--orange:#f57c00;--text:#212121;--muted:#5f6368;--muted2:#80868b;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ─ MAIN CONTAINER ─ */
.main-container{display:flex;height:100%;}

/* ─ LEFT SIDEBAR MENU ─ */
.sidebar{position:fixed;left:0;top:0;width:260px;height:100%;background:var(--panel);
  border-right:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-title{font-size:13px;font-weight:700;color:var(--text);}
.sidebar-body{flex:1;overflow-y:auto;padding:8px 0;}
.menu-section{padding:8px 0;border-bottom:1px solid var(--border);}
.menu-section:last-child{border-bottom:none;}
.menu-section-title{padding:10px 16px;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.menu-section-toggle{font-size:10px;transition:transform .2s;}
.menu-section-toggle.open{transform:rotate(180deg);}
.menu-items{display:none !important;max-height:0;overflow:hidden;transition:all .2s ease;}
.menu-items.open{display:flex !important;flex-direction:column;max-height:500px;}
.menu-item{padding:8px 20px;font-size:12px;color:var(--muted2);cursor:pointer;transition:all .15s;}
.menu-item:hover{color:var(--accent);background:rgba(30,136,229,.05);}
.menu-item.active{color:var(--accent);background:rgba(30,136,229,.1);font-weight:600;}
.sidebar-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);
  z-index:999;display:none;}
.sidebar-overlay.open{display:block;}

/* ─ MENU TOGGLE BUTTON ─ */
.menu-toggle{position:absolute;top:12px;left:12px;width:36px;height:36px;
  background:var(--card);border:1px solid var(--border2);border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;
  z-index:500;transition:all .2s;}
.menu-toggle:hover{border-color:var(--accent);color:var(--accent);}

/* ─ RIGHT CONTENT WRAPPER ─ */
.content-wrapper{flex:1;display:flex;flex-direction:column;height:100%;}

/* ─ TOP BAR WITH TITLE & CONTROLS ─ */
.top-bar{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.top-left{display:flex;align-items:center;gap:12px;flex:1;}
.title-group{display:flex;align-items:center;gap:8px;}
.title-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#42a5f5);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.title-text{display:flex;flex-direction:column;}
.title-main{font-size:14px;font-weight:700;color:var(--text);}
.title-sub{font-size:10px;color:var(--muted2);}
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.control-btn{height:32px;padding:0 12px;background:var(--card);border:1px solid var(--border2);
  border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);
  font-family:var(--font);transition:all .15s;white-space:nowrap;}
.control-btn:hover{border-color:var(--accent);color:var(--accent);}
.control-btn.active{background:rgba(30,136,229,.1);color:var(--accent);border-color:var(--accent);}
.status-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted2);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ─ HEADER ─ */
.hdr{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-right{display:flex;align-items:center;gap:14px;}
.badge-pill{background:var(--card);border:1px solid var(--border2);border-radius:20px;
  padding:3px 10px;font-size:11px;color:var(--muted2);font-family:var(--mono);}

/* ─ SUB-TABS BAR ─ */
.sub-tabs{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.sub-tab-btn{padding:11px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  border:none;background:none;font-family:var(--font);border-bottom:3px solid transparent;
  white-space:nowrap;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;}
.sub-tab-btn:hover{color:var(--text);}
.sub-tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ─ FETCH STATUS ─ */
.fetch-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:4px 20px;
  background:rgba(30,136,229,.06);border-bottom:1px solid var(--border);font-size:11px;
  color:var(--muted2);min-height:26px;}

/* ─ SLICERS ─ */
.slicers{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sl-wrap{position:relative;}
.sl-btn{background:var(--card);border:1px solid var(--border2);color:var(--muted2);
  border-radius:6px;padding:6px 26px 6px 11px;cursor:pointer;font-family:var(--font);
  font-size:12px;min-width:130px;text-align:left;white-space:nowrap;transition:all .15s;position:relative;}
.sl-btn:after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;}
.sl-btn:hover,.sl-btn.active{border-color:var(--accent);color:var(--text);}
.sl-btn.active{color:var(--accent);background:rgba(30,136,229,.08);}
.sl-drop{position:absolute;top:calc(100% + 4px);left:0;min-width:210px;background:#ffffff;
  border:1px solid var(--border2);border-radius:8px;z-index:9999;display:none;
  flex-direction:column;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:320px;overflow:hidden;}
.sl-drop.open{display:flex;}
.sl-search{padding:8px;border-bottom:1px solid var(--border);}
.sl-search input{width:100%;background:var(--bg);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);padding:5px 8px;font-size:11px;font-family:var(--font);outline:none;}
.sl-search input:focus{border-color:var(--accent);}
.sl-actions{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);}
.sl-action-btn{flex:1;padding:4px 8px;background:none;border:1px solid var(--border2);
  border-radius:4px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);}
.sl-action-btn:hover{border-color:var(--accent);color:var(--accent);}
.sl-list{overflow-y:auto;max-height:220px;}
.sl-item{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;}
.sl-item:hover{background:rgba(30,136,229,.07);}
.sl-item input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0;pointer-events:none;}
.sl-item label{cursor:pointer;font-size:11px;color:var(--muted2);pointer-events:none;}
.sl-item:hover label{color:var(--text);}
.clear-btn{background:none;border:1px solid var(--border2);color:var(--muted);
  border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;font-family:var(--font);}
.clear-btn:hover{border-color:var(--red);color:var(--red);}

/* ─ KPI CARDS ─ */
.kpi-strip{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--border);}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;position:relative;overflow:hidden;}
.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:8px 8px 0 0;}
.kpi.cb:before{background:var(--accent);}
.kpi.cg:before{background:var(--green);}
.kpi.cr:before{background:var(--red);}
.kpi.cp:before{background:var(--purple);}
.kpi-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.kpi-val{font-size:16px;font-weight:700;font-family:var(--mono);}
.kpi-val.cb{color:var(--accent);}
.kpi-val.cg{color:var(--green);}
.kpi-val.cr{color:var(--red);}
.kpi-val.cp{color:var(--purple);}

/* ─ TABS ─ */
.tabs-bar{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.tab-btn{padding:9px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  border:none;background:none;font-family:var(--font);border-bottom:2px solid transparent;
  white-space:nowrap;transition:all .15s;text-transform:capitalize;letter-spacing:.3px;}
.tab-btn:hover{color:var(--muted2);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ─ MAIN SCROLL AREA ─ */
.main{flex:1;overflow-y:auto;padding:14px 20px 24px;}

/* ─ PLACEHOLDER PAGE ─ */
.placeholder-page{display:flex;align-items:center;justify-content:center;height:100%;min-height:400px;}
.placeholder-content{text-align:center;}
.placeholder-icon{font-size:48px;margin-bottom:16px;}
.placeholder-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;}
.placeholder-text{font-size:13px;color:var(--muted);line-height:1.5;}

/* ─ CHARTS ─ */
.charts-grid{display:grid;gap:12px;margin-bottom:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g1{grid-template-columns:1fr;}
.ch-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;}
.ch-title{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:10px;}
.ch-wrap{position:relative;height:280px;}

#summaryLabel{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:5px 20px;display:flex;flex-direction:row;align-items:center;gap:8px;}
#summaryLabel span{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;}
/* ─ ACTIVE COUNT (HR Operations) ─ */
.ac-heading{font-size:16px;font-weight:700;color:var(--text);}
.ac-sub{font-size:11px;color:var(--muted2);margin-bottom:12px;}
.ac-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
.ac-kpis .kpi{padding:12px 14px;}
.ac-kpis .kpi-val{font-size:22px;}
.ac-note{background:rgba(251,192,45,.12);border:1px solid rgba(251,192,45,.5);border-radius:6px;padding:8px 12px;font-size:11px;margin-bottom:12px;}
.ac-count{font-size:11px;color:var(--muted2);margin-bottom:8px;}
.ac-filters{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;}
.ac-filters label{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.ac-filters input[type=date]{background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;font-family:var(--font);font-size:12px;color:var(--text);}
.ac-msg{font-size:12px;color:var(--muted);padding:12px 4px;}
.ac-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:6px;background:var(--panel);}
.ac-table{width:100%;border-collapse:collapse;font-size:12px;}
.ac-table th{position:sticky;top:0;background:var(--card);text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border);}
.ac-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.ac-table tr:hover td{background:rgba(30,136,229,.05);}
.ac-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;position:relative;z-index:50;}
.ac-fl{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.ac-fl input[type=date],.ac-select{background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;font-family:var(--font);font-size:12px;color:var(--text);min-width:150px;}
.ac-hint{text-transform:none;letter-spacing:0;color:var(--muted2);}
.ac-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media (max-width:860px){.ac-row{grid-template-columns:1fr !important;}}
.ac-empty{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;text-align:center;padding:20px;}
</style>
</head>
<body>

<div class="main-container">
  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
  <!-- SIDEBAR MENU -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📊 Menu</div>
    </div>
    <div class="sidebar-body">
      <!-- Recruitment -->
      <div class="menu-section">
        <div class="menu-section-title" onclick="toggleMenuSection(this)">
          Recruitment
          <span class="menu-section-toggle">▼</span>
        </div>
        <div class="menu-items">
          <div class="menu-item" onclick="openPage('recruitment','open-positions')">Open Positions</div>
          <div class="menu-item" onclick="openPage('recruitment','hiring-funnel')">Hiring Funnel</div>
        </div>
      </div>
      
      <!-- HR Operations -->
      <div class="menu-section">
        <div class="menu-section-title" onclick="toggleMenuSection(this)">
          HR Operations
          <span class="menu-section-toggle">▼</span>
        </div>
        <div class="menu-items">
          <div class="menu-item" onclick="openPage('hr-ops','attrition')">Attrition</div>
          <div class="menu-item" onclick="openPage('hr-ops','active-count')">Active Count</div>
        </div>
      </div>
      
      <!-- Training -->
      <div class="menu-section">
        <div class="menu-section-title" onclick="toggleMenuSection(this)">
          Training
          <span class="menu-section-toggle">▼</span>
        </div>
        <div class="menu-items">
          <div class="menu-item active" onclick="openPage('training','new-hire-training')">New Hire Training</div>
          <div class="menu-item" onclick="openPage('training','ld')">L&D</div>
          <div class="menu-item" onclick="openPage('training','gurukul')">Gurukul</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT WRAPPER -->
  <div class="content-wrapper">
    <!-- TOP BAR WITH TITLE AND CONTROLS -->
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">☰</button>
      <div class="top-left">
        <div class="title-group">
          <div class="title-icon">🎓</div>
          <div class="title-text">
            <div class="title-main" id="pageTitle">Card Trade Tech</div>
            <div class="title-sub" id="pageSub">Analytics Dashboard</div>
          </div>
        </div>
      </div>
      <div class="top-right">
        <button class="control-btn" id="lblToggle" onclick="toggleGlobalLabels()">Labels OFF</button>
        <button class="control-btn" onclick="refreshData()" title="Refresh data">🔄</button>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span id="statusText">Live</span>
        </div>
      </div>
    </div>

    <!-- HEADER (shows row count) -->
    <div class="hdr" id="hdr" style="display:none;">
      <div class="hdr-left"></div>
      <div class="hdr-right">
        <div class="badge-pill" id="rcBadge" style="display:none;"></div>
      </div>
    </div>

    <!-- SUB-TABS -->
    <div class="sub-tabs" id="subTabs" style="display:none;"></div>

    <!-- FETCH STATUS -->
    <div class="fetch-bar" id="fetchBar" style="display:none;">
      <span id="fetchStatus">⏳ Loading data…</span>
    </div>

    <!-- TABS BAR (for Training → New Hire Training only) -->
    <div class="tabs-bar" id="tabsBar" style="display:none;">
      <button class="tab-btn active" data-tab="batch">BATCHES</button>
      <button class="tab-btn" data-tab="trng">TRAINING SCHEDULE</button>
      <button class="tab-btn" data-tab="quality">QUALITY PKT CERTIFICATION</button>
      <button class="tab-btn" data-tab="kra">KRA CERTIFICATION</button>
    </div>

    <!-- SLICERS (for Training → New Hire Training only) -->
    <div class="slicers" id="slicersBar" style="display:none;">
      <button class="clear-btn" id="clearAllBtn">✕ Clear All</button>
    </div>

    <!-- L&D FILTERS (Training → L&D only) -->
    <div class="slicers" id="lndSlicersBar" style="display:none;"></div>

    <!-- SUMMARY LABEL -->
    <div id="summaryLabel" style="display:none;">
      <span>● Overall Summary</span>
    </div>

    <!-- KPI STRIP -->
    <div class="kpi-strip" id="kpiStrip" style="display:none;"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="main" id="mainArea"></div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

// ═══════════════════════════════════════════════════════════
//  GOOGLE SHEET CSV CONFIGURATION
// ═══════════════════════════════════════════════════════════
const SID = '15bfez78kZ2S1hZ3nynVGF1pPnjulJ3cCD3lBj085dyE';
const GID = '2099952935';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SID}/export?format=csv&gid=${GID}`;

// ═══════════════════════════════════════════════════════════
//  STATE & INITIALIZATION
// ═══════════════════════════════════════════════════════════
let currentSection = 'training';
let currentSubTab = 'new-hire-training';
let currentTab = 'batch';
let DATA = [];
const chartInst = {};
let globalLabels = false;
let autoRefreshInterval = null;

// Section definitions
const SECTIONS = {
  recruitment: {
    name: 'Recruitment',
    icon: '💼',
    subTabs: [
      {id: 'open-positions', label: 'Open Positions'},
      {id: 'hiring-funnel', label: 'Hiring Funnel'}
    ]
  },
  'hr-ops': {
    name: 'HR Operations',
    icon: '👥',
    subTabs: [
      {id: 'attrition', label: 'Attrition'},
      {id: 'active-count', label: 'Active Count'}
    ]
  },
  training: {
    name: 'Training',
    icon: '🎓',
    subTabs: [
      {id: 'new-hire-training', label: 'New Hire Training'},
      {id: 'ld', label: 'L&D'},
      {id: 'gurukul', label: 'Gurukul'}
    ]
  }
};

const SLICER_KEYS = ['Batches','Process','Trainer Name','Status','Batch Type','Month'];
const SLICER_LABELS = {'Batches':'Batches','Process':'Process','Trainer Name':'Trainer Name','Status':'Status','Batch Type':'Batch Type','Month':'Month'};
const slicerSel = {};
SLICER_KEYS.forEach(k => slicerSel[k] = new Set());

// ─ MENU TOGGLE ─
function toggleMenu() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

function toggleMenuSection(el) {
  const items = el.nextElementSibling;
  const toggle = el.querySelector('.menu-section-toggle');
  if(items) {
    items.classList.toggle('open');
  }
  if(toggle) {
    toggle.classList.toggle('open');
  }
}

function openPage(section, subTab) {
  closeSidebarMenu();
  currentSection = section;
  currentSubTab = subTab;
  renderSubTabs();
  renderPage();
}

function closeSidebarMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebarMenu);

// ─ TAB HANDLERS ─
document.addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderTab();
}, true);

// ═══════════════════════════════════════════════════════════
//  SUB-TAB RENDERING
// ═══════════════════════════════════════════════════════════
function renderSubTabs() {
  const subTabsBar = document.getElementById('subTabs');
  const section = SECTIONS[currentSection];
  
  subTabsBar.innerHTML = section.subTabs.map(tab => 
    `<button class="sub-tab-btn ${tab.id === currentSubTab ? 'active' : ''}" data-subtab="${tab.id}">${tab.label}</button>`
  ).join('');
  
  subTabsBar.querySelectorAll('.sub-tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {

// ═══════════════════════════════════════════════════════════
//  CSV PARSING & DATA LOADING
// ═══════════════════════════════════════════════════════════
function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        row.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    row.push(current);
    result.push(row);
  }
  return result;
}

async function fetchData() {
  const bar = document.getElementById('fetchBar');
  const status = document.getElementById('fetchStatus');
  
  try {
    const resp = await fetch(CSV_URL, { method: 'GET', mode: 'cors' });
    
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    
    const text = await resp.text();
    const rows = parseCSV(text);
    
    if (rows.length < 5) {
      throw new Error('Sheet is empty or missing data');
    }
    
    const headers = rows[2].map((h, i) => {
      const h2 = (rows[1] && rows[1][i]) ? String(rows[1][i]).trim() : '';
      const h3 = h ? String(h).trim() : '';
      return { h2, h3 };
    });
    const dataRows = rows.slice(4);
    
    DATA = dataRows
      .filter(row => row.length > 5 && row[0] && row[0].trim())
      .map(row => {
        const obj = {};
        headers.forEach((hd, i) => {
          const val = (row[i] || '').trim();
          if (hd.h3) obj[hd.h3] = val;
          if (hd.h2 && obj[hd.h2] === undefined) obj[hd.h2] = val;
        });
        return obj;
      });
    
    console.log('✅ Data loaded:', DATA.length, 'rows');
    
    document.getElementById('statusText').textContent = 'Live';
    bar.style.display = 'none';
    
    buildSlicers();
    renderPage();
  } catch(e) {
    console.error('❌ Fetch error:', e.message);
    status.textContent = `⚠️ Failed to load data`;
    document.getElementById('statusText').textContent = 'Error';
    document.getElementById('mainArea').innerHTML = '<div class="placeholder-page"><div class="placeholder-content"><div class="placeholder-icon">❌</div><div class="placeholder-title">Data Load Error</div><div class="placeholder-text">' + e.message + '</div></div></div>';
  }
}

function refreshData() {
  document.getElementById('statusText').textContent = 'Refreshing...';
  fetchData();

  fetchActiveData();
}

  let vals = [...new Set(baseData.map(r => r[key]).filter(v => v != null && v !== ''))];

}

function buildSlicers() {
  const bar = document.getElementById('slicersBar');
  const clearBtn = document.getElementById('clearAllBtn');
  
  while (bar.firstChild !== clearBtn) {
    bar.removeChild(bar.firstChild);
  }

  SLICER_KEYS.forEach(key => {
    const availableVals = getAvailableValues(key, DATA);
    
    const id = 'sl_' + key.replace(/\W/g,'_');
    const wrap = document.createElement('div');
    wrap.className = 'sl-wrap';
    wrap.innerHTML = `
      <button class="sl-btn" id="sbtn_${id}">${SLICER_LABELS[key]}</button>
      <div class="sl-drop" id="sdrop_${id}">
        <div class="sl-search"><input type="text" placeholder="Search…" id="ssrch_${id}"></div>
        <div class="sl-actions">
          <button class="sl-action-btn" onclick="selectAllValues('${id}','${key}')">Select All</button>
          <button class="sl-action-btn" onclick="clearSingleFilter('${key}','${id}')">Clear</button>
        </div>
        <div class="sl-list" id="slist_${id}">
          ${availableVals.map(v => `<div class="sl-item" data-key="${key}" data-id="${id}" data-val="${v}"><input type="checkbox"><label>${v}</label></div>`).join('')}
        </div>
      </div>`;
    bar.insertBefore(wrap, clearBtn);
  });

  document.getElementById('slicersBar').addEventListener('click', e => {
    const btn = e.target.closest('.sl-btn');
    if (btn) {
      const id = btn.id.replace('sbtn_','');
      const dd = document.getElementById('sdrop_' + id);
      closeAllDrops();
      dd.classList.add('open');
      return;
    }
    const item = e.target.closest('.sl-item');
    if (item) {
      const key = item.dataset.key, id = item.dataset.id;
      const cb = item.querySelector('input');
      const val = item.querySelector('label').textContent;
      cb.checked = !cb.checked;
      if (cb.checked) slicerSel[key].add(val); else slicerSel[key].delete(val);
      updateBtn(key, id); 
      updateFilteredDropdowns();
      refresh();
    }
    if (e.target.closest('#clearAllBtn')) clearAllFilters();
  });

  document.getElementById('slicersBar').addEventListener('input', e => {
    const inp = e.target;
    if (!inp.id || !inp.id.startsWith('ssrch_')) return;
    const listId = 'slist_' + inp.id.replace('ssrch_','');
    const q = inp.value.toLowerCase();
    document.querySelectorAll(`#${listId} .sl-item`).forEach(item => {
      item.style.display = item.querySelector('label').textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.sl-wrap')) closeAllDrops();
  });
}

function fmt(v,f='p'){
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(f==='p') return (v*100).toFixed(1)+'%';
  if(f==='n') return Math.round(v).toLocaleString();
  return Number(v).toFixed(2);
}

function normalizePercentage(val) {
  if(val === null || val === undefined || val === '') return null;
  const str = String(val).trim();
  if(str === 'NA' || str === 'N/A' || str === '') return null;
  const v = parseFloat(str);
  if(isNaN(v)) return null;
  if(v > 1) return v / 100;
  return v;
}

function groupBy(data,gk,vk,agg='wavg',wk='Headcount (Day 0)',isPct=false){
  const g={};
  data.forEach(r=>{
    const k=r[gk]||'?';
    if(!g[k])g[k]={v:[],w:[]};
    let v = isPct ? normalizePercentage(r[vk]) : parseFloat(r[vk]);
    if(v!=null&&!isNaN(v)){
      g[k].v.push(v);
      g[k].w.push(parseFloat(r[wk])||1);
    }
  });
  const res={};
  for(const[k,{v,w}]of Object.entries(g)){
    if(!v.length){res[k]=null;continue;}
    if(agg==='sum')res[k]=v.reduce((a,b)=>a+b,0);
    else{
      const d=w.reduce((a,b)=>a+b,0);
      res[k]=d?v.reduce((s,x,i)=>s+x*w[i],0)/d:null;
    }
  }
  return res;
}

// ═══════════════════════════════════════════════════════════
//  KPI STRIP
// ═══════════════════════════════════════════════════════════
function renderKPIStrip(data) {
  const totalHC = data.reduce((s,r) => s+(parseFloat(r['Headcount (Day 0)'])||0),0);
  const totalEnd = data.reduce((s,r) => s+(parseFloat(r['Count -Trng end'])||0),0);
  const totalAttr = data.reduce((s,r) => s+(parseFloat(r['Total Attrition'])||0),0);
  const bCount = new Set(data.map(r=>r['Batches'])).size;
  
  function findKey(pattern){
    const keys = Object.keys(data[0]||{});
    return keys.find(k => pattern.test(k)) || null;
  }
  function wavg(f,isPct=true){
    if(!f) return null;
    let n=0,d=0;
    data.forEach(r=>{
      const w=parseFloat(r['Headcount (Day 0)'])||0;
      let v = isPct ? normalizePercentage(r[f]) : parseFloat(r[f]);
      if(v!=null&&!isNaN(v)){n+=v*w;d+=w;}
    });
    return d?n/d:null;
  }
  
  function simpleAvg(f){
    if(!f) return null;
    let s=0,c=0;
    data.forEach(r=>{
      const v=normalizePercentage(r[f]);
      if(v!=null&&!isNaN(v)){s+=v;c++;}
    });
    return c?s/c:null;
  }
  
  const thruputKey = findKey(/thruput\s*conversion/i) || 'Conversion(Training start to end) %';
  const pktKey = findKey(/^pkt\s*certification\s*%?$/i) || 'PKT Certification %';
  
  const kpis = [
    {l:'Total Batches',v:bCount,f:'n',c:'cb'},
    {l:'Total Headcount (Day 0)',v:totalHC,f:'n',c:'cb'},
    {l:'Total Training End HC',v:totalEnd,f:'n',c:'cg'},
    {l:'Total Attrition',v:totalAttr,f:'n',c:'cr'},
    {l:'Avg Thruput Conversion %',v:simpleAvg(thruputKey),f:'p',c:'cg'},
    {l:'PKT Certification %',v:simpleAvg(pktKey),f:'p',c:'cp'},
  ];
  
  document.getElementById('kpiStrip').innerHTML = kpis.map(k => `
    <div class="kpi ${k.c}">
      <div class="kpi-lbl">${k.l}</div>
      <div class="kpi-val ${k.c}">${fmt(k.v,k.f)}</div>
    </div>`).join('');
}

function resolveLndColumns(headers){

function parseCSVFull(text){
  const rows = [];
  let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === ','){ row.push(cell); cell = ''; }
      else if(c === '\r'){ /* ignore */ }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

async function fetchLndData(){
  try{
    const resp = await fetch(LND_CSV_URL, {method:'GET', mode:'cors'});
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const rows = parseCSVFull(await resp.text());
    if(rows.length < 3) throw new Error('L&D sheet is empty or missing data');
    
    const headers = rows[1].map(h => String(h||'').trim());   // Row 2 = headers
    LND_COL = resolveLndColumns(headers);
    const keepCols = Object.values(LND_COL).filter(Boolean);
    
    LND_DATA = rows.slice(2)                                    // Row 3 onward
      .map(r => {
        const o = {};
        headers.forEach((h,i) => { if(h && o[h]===undefined) o[h] = (r[i]||'').trim(); });
        o.__inv = (r[9]||'').trim();    // Column J — Invited
        o.__att = (r[10]||'').trim();   // Column K — Attended
        o.__conv = (r[11]||'').trim();  // Column L — Attendance Conversion %
        return o;
      })
      .filter(o => keepCols.some(c => o[c]));
    
    // Merge values that differ only by case or extra spaces (SUMIFS treats them as the same)
    const canonMap = {};
    const clean = v => String(v || '').replace(/\s+/g, ' ').trim();
    LND_DATA.forEach(o => {
      ['month','year','func','trainer'].forEach(k => {
        const col = LND_COL[k];
        if(!col) return;
        const v = clean(o[col]);
        if(!v){ o[col] = ''; return; }
        const key = k + '|' + v.toLowerCase();
        if(!canonMap[key]) canonMap[key] = v;
        o[col] = canonMap[key];
      });
    });
    
    LND_READY = true;
    LND_ERROR = '';
    console.log('✅ L&D data loaded:', LND_DATA.length, 'rows');
  }catch(e){
    console.error('❌ L&D fetch error:', e.message);
    LND_ERROR = e.message;
  }
  buildLndSlicers();
  if(currentSection === 'training' && currentSubTab === 'ld') renderLnd();
}

function getLndAvailable(key){
  const col = LND_COL[key];
  if(!col) return [];
  const base = LND_DATA.filter(r => LND_FILTERS.every(f =>
    f.key === key || !lndSel[f.key].size || lndSel[f.key].has(r[LND_COL[f.key]])));
  return [...new Set(base.map(r => r[col]).filter(v => v))].sort();
}

function lndFiltered(){
  return LND_DATA.filter(r => LND_FILTERS.every(f =>
    !lndSel[f.key].size || lndSel[f.key].has(r[LND_COL[f.key]])));
}

function buildLndSlicers(){
  const bar = document.getElementById('lndSlicersBar');
  bar.innerHTML = LND_FILTERS.map(f => `
    <div class="sl-wrap">
      <button class="sl-btn" data-lnd="${f.key}" id="lbtn_${f.key}">${f.label}</button>
      <div class="sl-drop" id="ldrop_${f.key}">
        <div class="sl-search"><input type="text" placeholder="Search…" data-lsrch="${f.key}"></div>
        <div class="sl-actions">
          <button class="sl-action-btn" data-lall="${f.key}">Select All</button>
          <button class="sl-action-btn" data-lclr="${f.key}">Clear</button>
        </div>
        <div class="sl-list" id="llist_${f.key}"></div>
      </div>
    </div>`).join('') + `<button class="clear-btn" id="lndClearAll">✕ Clear All</button>`;
  
  if(!bar.dataset.bound){
    bar.addEventListener('click', onLndBarClick);
    bar.addEventListener('input', e => {
      const k = e.target.dataset && e.target.dataset.lsrch;
      if(k) filterLndList(k);

function onLndBarClick(e){
  const t = e.target;
  const btn = t.closest('.sl-btn');
  if(btn){
    const drop = document.getElementById('ldrop_' + btn.dataset.lnd);
    const wasOpen = drop.classList.contains('open');
    closeAllDrops();
    if(!wasOpen) drop.classList.add('open');
    return;
  }
  const item = t.closest('.sl-item');
  if(item){
    const s = lndSel[item.dataset.key], v = item.dataset.val;
    if(s.has(v)) s.delete(v); else s.add(v);
    renderLnd();
    return;
  }
  if(t.dataset.lall){
    const k = t.dataset.lall;
    getLndAvailable(k).forEach(v => lndSel[k].add(v));
    renderLnd();
    return;
  }
  if(t.dataset.lclr){
    lndSel[t.dataset.lclr].clear();
    renderLnd();
    return;
  }
  if(t.id === 'lndClearAll'){
    LND_FILTERS.forEach(f => lndSel[f.key].clear());
    renderLnd();
  }
}

function filterLndList(k){
  const q = (document.querySelector(`[data-lsrch="${k}"]`)?.value || '').toLowerCase();

function refreshLndFilters(){

function renderLndKpis(data){
  const num = (r,c) => parseFloat(String(r[c]||'').replace(/,/g,'')) || 0;
  const invited = LND_COL.invited ? data.reduce((s,r) => s + num(r, LND_COL.invited), 0) : null;
  const attended = LND_COL.attended ? data.reduce((s,r) => s + num(r, LND_COL.attended), 0) : null;
  const convVals = LND_COL.conv
    ? data.map(r => normalizePercentage(r[LND_COL.conv])).filter(v => v != null && !isNaN(v))
    : [];
  const convAvg = convVals.length ? convVals.reduce((a,b) => a + b, 0) / convVals.length : null;
  
  const sessions = LND_COL.sessions ? data.reduce((s,r) => s + num(r, LND_COL.sessions), 0) : data.length;
  
  const kpis = [
    {l:'Invited Participants', v:invited, f:'n', c:'cb'},
    {l:'Attended Participants', v:attended, f:'n', c:'cg'},
    {l:'Attendance Conversion %', v:convAvg, f:'p', c:'cp'},

function lndGroup(data, gKey){

function lndSumBy(groups, col){

const acClean = v => String(v == null ? '' : v).replace(/\s+/g,' ').trim();

function acYear(s){ const n = +s; return n < 100 ? (n > 50 ? 1900 : 2000) + n : n; }

function acMakeDate(y,m,d){
  if(!y || !m || !d) return null;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return dt;
}

// Sheet date text: 25-Apr-2004, 25 Apr 2004, Apr 25, 2004, 2004-04-25, 25/04/2004, Date(2004,3,25)
function acParseDate(v){
  if(v instanceof Date) return isNaN(v) ? null : v;
  const s = acClean(v);
  if(!s) return null;
  let m;
  if((m = s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/))) return acMakeDate(+m[1], +m[2]+1, +m[3]);
  if((m = s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3,})[-\s\/,]+(\d{2,4})$/))){
    const mo = AC_MONTHS[m[2].slice(0,3).toLowerCase()];
    return mo ? acMakeDate(acYear(m[3]), mo, +m[1]) : null;
  }
  if((m = s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{2,4})$/))){
    const mo = AC_MONTHS[m[1].slice(0,3).toLowerCase()];
    return mo ? acMakeDate(acYear(m[3]), mo, +m[2]) : null;
  }
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return acMakeDate(+m[1], +m[2], +m[3]);
  if((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) return acMakeDate(acYear(m[3]), +m[2], +m[1]);
  return null;
}

// LWD: "Active" = still working; a valid date = Last Working Day; anything else = unverified
function acParseLwd(v){
  const s = acClean(v);
  if(!s) return {type:'blank', date:null};
  if(/active/i.test(s)) return {type:'active', date:null};
  const d = acParseDate(s);
  if(d) return {type:'date', date:d};
  return {type:'invalid', date:null};
}

function acGender(v){
  const g = acClean(v).toLowerCase();
  if(g === 'male' || g === 'm') return 'Male';
  if(g === 'female' || g === 'f') return 'Female';
  return '';
}

// Excel EDATE semantics
function acEdate(d, months){
  const t = new Date(d.getFullYear(), d.getMonth() + months, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return new Date(t.getFullYear(), t.getMonth(), Math.min(d.getDate(), last));
}

// Excel DATEDIF(start, end, "Y") — completed years
function acDatedifY(j, e){
  let y = e.getFullYear() - j.getFullYear();
  if(e.getMonth() < j.getMonth() || (e.getMonth() === j.getMonth() && e.getDate() < j.getDate())) y--;
  return y;
}

// Completed months between two dates (DATEDIF "M" semantics)
function acMonthsCompleted(j, e){
  let m = (e.getFullYear() - j.getFullYear()) * 12 + (e.getMonth() - j.getMonth());
  if(e.getDate() < j.getDate()) m--;
  return m;
}

function acFmt(d){
  if(!d) return '—';
  return `${String(d.getDate()).padStart(2,'0')}-${AC_MON[d.getMonth()]}-${d.getFullYear()}`;
}

// <input type="date"> value (yyyy-mm-dd) → Date or null
function acInputDate(v){
  if(!v) return null;
  const p = v.split('-').map(Number);
  return acMakeDate(p[0], p[1], p[2]);
}

function acTodayDate(){
  const t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

// Date range: returns {from,to} with from <= to, or null when no date is selected.
// Only one date selected = a single day.
function acRange(){
  const f = acInputDate(AC_FILTERS.from), t = acInputDate(AC_FILTERS.to);
  if(!f && !t) return null;
  let a = f || t, b = t || f;
  if(a > b) { const tmp = a; a = b; b = tmp; }
  return {from:a, to:b};
}

// Snapshot date for pie, tenure table and new-hire-independent counts: To Date if a range is set, else today
function acSnapDate(){
  const r = acRange();
  return r ? r.to : acTodayDate();
}

fetch;
// Strict CSV reader for the Active Count sheet only: a quote starts a quoted field only at the start of a cell
function acParseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else if(c === '"' && cell === ''){
      q = true;
    } else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\r'){ /* ignore */ }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

async function fetchActiveData(){
  try{
    const resp = await fetch(AC_CSV_URL, {method:'GET', mode:'cors'});
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const rows = acParseCsv(await resp.text())
      .map(r => r.slice(0, AC_COL_COUNT));                     // columns A–K only
    if(rows.length < 2) throw new Error('Active Count sheet is empty');

    const hdr = rows[0].map(h => acClean(h));                 // Row 1 = headers
    const idx = {};
    AC_REQUIRED.forEach(name => { idx[name] = hdr.findIndex(h => h.toLowerCase() === name.toLowerCase()); });
    AC_MISSING = AC_REQUIRED.filter(n => idx[n] < 0);
    const cell = (r,name) => idx[name] >= 0 ? acClean(r[idx[name]]) : '';

    AC_DATA = rows.slice(1)                                    // every row, no row limit
      .map(r => {
        const lwd = acParseLwd(cell(r,'LWD'));
        return {
          code: cell(r,'Associate Code'),
          name: cell(r,'Associate Name'),
          dept: cell(r,'Department'),
          manager: cell(r,'Managers'),
          location: cell(r,'Work Location'),
          designation: cell(r,'Designation'),
          joined: acParseDate(cell(r,'Date Joined')),
          lwdRaw: cell(r,'LWD'),
          lwdType: lwd.type,
          lwdDate: lwd.date,
          gender: acGender(cell(r,'Gender')),
          dob: acParseDate(cell(r,'Date of Birth')),
          branch: cell(r,'Branch'),
        };
      })
      .filter(e => e.code);

    const joins = AC_DATA.map(e => e.joined).filter(Boolean);
    AC_REF = joins.length ? new Date(Math.max(...joins.map(d => d.getTime()))) : null;
    AC_READY = true;
    AC_ERROR = '';
    console.log('✅ Active Count loaded:', AC_DATA.length, 'employee records');
  }catch(e){
    console.error('❌ Active Count fetch error:', e.message);
    AC_ERROR = e.message;
  }
  if(currentSection === 'hr-ops' && currentSubTab === 'active-count') renderActiveCount();
}

// Working on a date: Date Joined <= date AND (LWD = Active OR date <= LWD). LWD day counted.
function acIsActive(e, day){
  if(!e.joined || e.joined > day) return false;
  if(e.lwdType === 'active') return true;
  if(e.lwdType === 'date') return day <= e.lwdDate;
  return false;   // blank / invalid LWD: status cannot be verified
}

function acAgeOn(e, day){
  if(!e.dob || e.dob > day) return null;
  return acDatedifY(e.dob, day);
}

// opts.ten / opts.age switch those filters on for this count. Department always applies when selected.
function acPass(e, day, opts){
  if(acSel.dept.size && !acSel.dept.has(e.dept)) return false;
  if(opts.ten && AC_FILTERS.ten){
    const r = AC_TENURE.find(x => x.k === AC_FILTERS.ten);
    const y = acDatedifY(e.joined, day);
    if(!(y >= r.min && y < r.max)) return false;
  }
  if(opts.age && AC_FILTERS.age){
    const r = AC_AGE.find(x => x.k === AC_FILTERS.age);
    const a = acAgeOn(e, day);
    if(a === null || !(a >= r.min && a < r.max)) return false;
  }
  return true;
}

function acWorking(day, opts){
  return AC_DATA.filter(e => acIsActive(e, day) && acPass(e, day, opts));
}

function acStats(day){
  let unverified = 0, noJoin = 0;
  AC_DATA.forEach(e => {
    if(!e.joined){ noJoin++; return; }
    if(e.joined <= day && e.lwdType !== 'active' && e.lwdType !== 'date') unverified++;
  });
  return {unverified, noJoin};
}

  if(AC_OPEN_DROP && currentSection === 'hr-ops' && currentSubTab === 'active-count' && !e.target.closest('.ac-fw')){
    AC_OPEN_DROP = null;
    renderActiveCount();
  }
});

// ── Excel-style cascading options ────────────────────────────
// Working population on a day with every filter applied except the one named in excl
function acPassEx(e, day, excl){
  if(excl !== 'dept' && acSel.dept.size && !acSel.dept.has(e.dept)) return false;
  if(excl !== 'ten' && AC_FILTERS.ten){
    if(!e.joined) return false;
    const r = AC_TENURE.find(x => x.k === AC_FILTERS.ten);
    const m = acMonthsCompleted(e.joined, day);
    if(!(m >= r.min && m < r.max)) return false;
  }
  if(excl !== 'age' && AC_FILTERS.age){
    const r = AC_AGE.find(x => x.k === AC_FILTERS.age);
    const a = acAgeOn(e, day);
    if(a === null || !(a >= r.min && a < r.max)) return false;
  }
  return true;
}

// Date range overlap rule: worked at least one day in From..To
// DOJ <= To Date AND (LWD = Active OR LWD >= From Date)
function acInRange(e, r){
  if(!e.joined || e.joined > r.to) return false;
  if(e.lwdType === 'active') return true;
  if(e.lwdType === 'date') return e.lwdDate >= r.from;
  return false;
}

// Employees counted for the current filters (all filters except the one named in excl)
function acBase(excl){
  const r = acRange(), day = acSnapDate();
  return AC_DATA.filter(e => (r ? acInRange(e, r) : true) && acPassEx(e, day, excl));
}

function acDeptFilterHtml(snap){
  const s = acSel.dept;
  const counts = {};
  acBase('dept').forEach(e => { if(e.dept) counts[e.dept] = (counts[e.dept] || 0) + 1; });
  const opts = [...new Set([...s, ...Object.keys(counts)])].sort();
  AC_OPT_CACHE.dept = opts;
  const label = s.size === 0 ? 'Department' : s.size === 1 ? [...s][0] : `Department (${s.size})`;
  return `<label class="ac-fl">Department
    <div class="sl-wrap ac-fw">
      <button class="sl-btn${s.size ? ' active' : ''}" onclick="acToggleDrop()">${escH(label)}</button>
      <div class="sl-drop${AC_OPEN_DROP === 'dept' ? ' open' : ''}">
        <div class="sl-search"><input type="text" placeholder="Search…" oninput="acListSearch(this.value)"></div>
        <div class="sl-actions"><button class="sl-action-btn" onclick="acClearDept()">Clear</button></div>
        <div class="sl-list" id="acl_dept">${opts.map((v,i) =>
          `<div class="sl-item" data-v="${escH(v)}" onclick="acToggleVal(${i})"><input type="checkbox"${s.has(v) ? ' checked' : ''}><label>${escH(v)} (${(counts[v] || 0).toLocaleString()})</label></div>`).join('')}</div>
      </div>
    </div></label>`;
}

// Tenure / Age dropdown: only bands that still have employees (with the other filters applied); selected band always kept
function acBandSelectHtml(label, key, bands, snap){
  const list = acBase(key);
  const withCount = bands.map(r => {
    const n = key === 'ten'
      ? list.filter(e => { if(!e.joined) return false; const m = acMonthsCompleted(e.joined, snap); return m >= r.min && m < r.max; }).length
      : list.filter(e => { const a = acAgeOn(e, snap); return a !== null && a >= r.min && a < r.max; }).length;
    return {r, n};
  }).filter(x => x.n > 0 || AC_FILTERS[key] === x.r.k);
  return `<label class="ac-fl">${label}
    <select class="ac-select" onchange="acSetFilter('${key}',this.value)"><option value="">All</option>${withCount.map(x =>
      `<option value="${x.r.k}"${AC_FILTERS[key] === x.r.k ? ' selected' : ''}>${x.r.l} (${x.n.toLocaleString()})</option>`).join('')}</select></label>`;
}

function acCard(title, id, h, note){
  return `<div class="ch-card"><div class="ch-title">${title}</div>${note ? `<div class="ac-count">${note}</div>` : ''}<div class="ch-wrap" style="height:${h}px"><canvas id="${id}"></canvas></div></div>`;
}

// Chart helper (same styling conventions as the rest of the app)
function acChart(id, type, labels, datasets, opts = {}){
  if(chartInst[id]){ chartInst[id].destroy(); delete chartInst[id]; }
  const el = document.getElementById(id);
  if(!el) return;
  const total = datasets.reduce((s,ds) => s + ds.data.reduce((a,b) => a + (b || 0), 0), 0);
  if(!labels.length || !total){
    el.parentElement.innerHTML = '<div class="ac-empty">No data for this chart</div>';
    return;
  }
  const isPie = type === 'pie';
  const gridC = 'rgba(209,220,230,.35)';
  chartInst[id] = new Chart(el.getContext('2d'), {
    type, data:{labels, datasets}, plugins:[ChartDataLabels],
    options:{
      responsive:true, maintainAspectRatio:false,
      indexAxis: opts.horizontal ? 'y' : 'x',
      plugins:{
        legend:{display:isPie, position:'bottom', labels:{color:CC.muted,font:{size:10},boxWidth:10,padding:8}},
        tooltip:{enabled:true},
        datalabels:{
          display: globalLabels === true,
          color:'#ffffff',
          font:{size:9,weight:'600',family:'"JetBrains Mono",monospace'},
          anchor: isPie ? 'center' : 'end',
          align: isPie ? 'center' : (opts.horizontal ? 'end' : 'top'),
          offset: isPie ? 0 : 2,
          clip:false,
          formatter: opts.labelFmt || (v => v ? Number(v).toLocaleString() : ''),
        }
      },
      scales: isPie ? undefined : {
        x:{ticks:{color:CC.muted,font:{size:9},maxRotation:38,autoSkip:false},grid:{color:gridC},border:{color:CC.border}},
        y:{ticks:{color:CC.muted,font:{size:9},precision:0},grid:{color:gridC},border:{color:CC.border},beginAtZero:true}
      }
    }
  });
}

function renderActiveCount(){
  const main = document.getElementById('mainArea');
  document.getElementById('kpiStrip').style.display = 'none';
  Object.keys(chartInst).filter(k => k.startsWith('ac_')).forEach(k => { chartInst[k].destroy(); delete chartInst[k]; });

  if(!AC_READY){
    main.innerHTML = AC_ERROR
      ? `<div class="placeholder-page"><div class="placeholder-content"><div class="placeholder-icon">❌</div><div class="placeholder-title">Active Count Load Error</div><div class="placeholder-text">${escH(AC_ERROR)}</div></div></div>`
      : `<div class="placeholder-page"><div class="placeholder-content"><div class="placeholder-icon">⏳</div><div class="placeholder-title">Loading Active Count Data...</div></div></div>`;
    return;
  }

  const snap = acSnapDate();
  const today = acTodayDate();
  const st = acStats(snap);

  const notes = [];
  if(AC_MISSING.length) notes.push(`Source column(s) not found: ${escH(AC_MISSING.join(', '))}.`);
  if(AC_ERROR) notes.push(`Latest refresh failed (${escH(AC_ERROR)}). Showing last loaded data.`);
  if(st.noJoin) notes.push(`${st.noJoin} record(s) with no valid Date Joined are excluded.`);
  if(snap < today) notes.push(`Historical view: working status uses Date Joined and LWD from the source sheet. Employees whose records were removed cannot be recovered.`);

  // Working population on the snapshot date with all four filters applied
  const pop = acBase(null);
  const male = pop.filter(e => e.gender === 'Male').length;
  const female = pop.filter(e => e.gender === 'Female').length;
  const unknownGender = pop.length - male - female;

  const branchMap = {};
  pop.forEach(e => { if(e.branch) branchMap[e.branch] = (branchMap[e.branch] || 0) + 1; });
  const branchRows = Object.entries(branchMap).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const blankBranch = pop.length - branchRows.reduce((s,r) => s + r[1], 0);

  const deptMap = {};
  pop.forEach(e => { if(e.dept) deptMap[e.dept] = (deptMap[e.dept] || 0) + 1; });
  const deptRows = Object.entries(deptMap).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const deptTotal = deptRows.reduce((s,r) => s + r[1], 0);
  const deptBlank = pop.length - deptTotal;

  // Manager by Department: (Department, Managers) pairs; blank or '0' values excluded
  const mgrPairs = {};
  pop.forEach(e => {
    if(!e.dept || !e.manager || e.manager === '0') return;
    const k = e.dept + ' | ' + e.manager;
    mgrPairs[k] = mgrPairs[k] || {dept:e.dept, manager:e.manager, n:0};
    mgrPairs[k].n++;
  });
  const mgrRows = Object.values(mgrPairs).sort((a,b) => b.n - a.n || a.dept.localeCompare(b.dept) || a.manager.localeCompare(b.manager));
  const blankMgr = pop.length - mgrRows.reduce((s,r) => s + r.n, 0);

  // Location-wise: Work Location column
  const locMap = {};
  pop.forEach(e => { if(e.location) locMap[e.location] = (locMap[e.location] || 0) + 1; });
  const locRows = Object.entries(locMap).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const blankLoc = pop.length - locRows.reduce((s,r) => s + r[1], 0);

  const filterBar = `<div class="ac-toolbar">
    <label class="ac-fl">From Date
      <input type="date" value="${AC_FILTERS.from}" onchange="acSetFilter('from',this.value)"></label>
    <label class="ac-fl">To Date
      <input type="date" value="${AC_FILTERS.to}" onchange="acSetFilter('to',this.value)"></label>
    ${acDeptFilterHtml(snap)}
    ${acBandSelectHtml('Tenure','ten',AC_TENURE,snap)}
    ${acBandSelectHtml('Age','age',AC_AGE,snap)}
    <button class="clear-btn" onclick="acClearAll()">✕ Clear All</button>
  </div>`;

  main.innerHTML = `
    ${notes.map(n => `<div class="ac-note">${n}</div>`).join('')}
    <div class="ac-heading">HR Overview</div>
    <div class="ac-sub">${acRange() ? `Employed between ${acFmt(acRange().from)} and ${acFmt(acRange().to)} (worked during range: joined by To Date; Active or LWD on/after From Date)` : `All employees as of ${acFmt(snap)}`} • latest join date: ${AC_REF ? acFmt(AC_REF) : '—'}</div>
    ${filterBar}

    <div class="ac-row">
      ${acCard('Gender Distribution','ac_gender', 300, unknownGender ? `${unknownGender} record(s) with blank or unrecognised Gender excluded` : `As of ${acFmt(snap)}`)}
      ${acCard('Branch-Wise Headcount','ac_branch', 300, blankBranch ? `${blankBranch} record(s) with blank Branch excluded` : `As of ${acFmt(snap)}`)}
    </div>

    <div class="ch-card ac-section">
      <div class="ch-title">Employee by Department</div>
      <div class="ac-count">${deptBlank ? `${deptBlank} record(s) with blank Department excluded • ` : ''}Total ${deptTotal.toLocaleString()}</div>
      ${deptRows.length ? acTable(['Department','Employees','% of Total'], deptRows.map(r => [escH(r[0]), r[1].toLocaleString(), pct(r[1], deptTotal)])) : acMsg('No department data for these filters.')}
    </div>
    <div class="ch-card ac-section"><div class="ch-title">Manager by Department</div>
      ${blankMgr ? `<div class="ac-count">${blankMgr.toLocaleString()} record(s) with blank or 0 Manager/Department excluded</div>` : ''}
      <div style="margin-top:12px">${mgrRows.length ? acTable(['Department','Manager','Employees','% of Total'], mgrRows.map(r => [escH(r.dept), escH(r.manager), r.n.toLocaleString(), pct(r.n, pop.length - blankMgr)])) : acMsg('No manager data for these filters.')}</div>
    </div>
    <div class="ch-card ac-section"><div class="ch-title">Location-Wise Headcount</div>
      ${blankLoc ? `<div class="ac-count">${blankLoc.toLocaleString()} record(s) with blank Work Location excluded • Total ${locRows.reduce((s,r) => s + r[1], 0).toLocaleString()}</div>` : ''}
      ${locRows.length ? acTable(['Location','Employees','% of Total'], locRows.map(r => [escH(r[0]), r[1].toLocaleString(), pct(r[1], locRows.reduce((s,x) => s + x[1], 0))])) : acMsg('No work location data for these filters.')}
    </div>
    `;

  acChart('ac_gender','pie', ['Male','Female'],
    [{data:[male, female], backgroundColor:['#1e88e5','#7c4dff'], borderWidth:0}],
    {labelFmt: (v, ctx) => {
      const tot = ctx.dataset.data.reduce((a,b) => a+b, 0);
      return v ? `${v.toLocaleString()} (${(v/tot*100).toFixed(1)}%)` : '';
    }});

  acChart('ac_branch','bar', branchRows.map(r => r[0]),
    [{label:'Working Employees', data:branchRows.map(r => r[1]), backgroundColor:'rgba(0,151,167,.75)', borderWidth:0, borderRadius:6}]);

}

// TAB 5: EXITS
function tabExits(main,data){
  main.innerHTML=`<div class="charts-grid g1"><div class="ch-card"><div class="ch-title">Total Attrition % by Process</div><div class="ch-wrap"><canvas id="c1"></canvas></div></div></div>`;
  const atr=groupBy(data,'Process','Attrition %','wavg','Headcount (Day 0)',true);
  const pl=Object.keys(atr).filter(k=>atr[k]!==null);
  mkChart('c1','bar',pl,[{data:pl.map(l=>atr[l]),backgroundColor:'rgba(211,47,47,.7)',borderWidth:0,borderRadius:6}],{isPct:true,extraOpts:{scales:{y:{ticks:{callback:v=>(v*100).toFixed(0),max:1},max:1}}}});
}
