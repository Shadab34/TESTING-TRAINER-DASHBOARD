<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CarWale NHT Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--panel:#ffffff;--card:#f8fbfd;--border:#d1dce6;--border2:#b8c5d6;
  --accent:#1e88e5;--green:#00c853;--red:#d32f2f;--purple:#7c4dff;
  --yellow:#fbc02d;--orange:#f57c00;--text:#212121;--muted:#5f6368;--muted2:#80868b;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ─ MAIN NAV BAR (3 sections) ─ */
.main-nav{flex-shrink:0;background:var(--panel);border-bottom:2px solid var(--accent);
  padding:12px 20px;display:flex;align-items:center;gap:20px;box-shadow:0 2px 4px rgba(0,0,0,.05);}
.nav-title{font-size:14px;font-weight:700;color:var(--text);flex-shrink:0;}
.main-sections{display:flex;gap:8px;flex-shrink:0;}
.main-sec-btn{padding:8px 20px;font-size:12px;font-weight:600;color:var(--text);
  background:var(--card);border:2px solid var(--border);border-radius:6px;cursor:pointer;
  font-family:var(--font);transition:all .25s;white-space:nowrap;}
.main-sec-btn:hover{border-color:var(--accent);color:var(--accent);}
.main-sec-btn.active{background:var(--accent);color:#ffffff;border-color:var(--accent);}

/* ─ SUB-TABS BAR ─ */
.sub-tabs{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.sub-tab-btn{padding:11px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  border:none;background:none;font-family:var(--font);border-bottom:3px solid transparent;
  white-space:nowrap;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;}
.sub-tab-btn:hover{color:var(--text);}
.sub-tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ─ HEADER ─ */
.hdr{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#42a5f5);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;color:var(--muted2);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:14px;}
.badge-pill{background:var(--card);border:1px solid var(--border2);border-radius:20px;
  padding:3px 10px;font-size:11px;color:var(--muted2);font-family:var(--mono);}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ─ FETCH STATUS ─ */
.fetch-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:4px 20px;
  background:rgba(30,136,229,.06);border-bottom:1px solid var(--border);font-size:11px;
  color:var(--muted2);min-height:26px;}

/* ─ SLICERS ─ */
.slicers{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sl-wrap{position:relative;}
.sl-btn{background:var(--card);border:1px solid var(--border2);color:var(--muted2);
  border-radius:6px;padding:6px 26px 6px 11px;cursor:pointer;font-family:var(--font);
  font-size:12px;min-width:130px;text-align:left;white-space:nowrap;transition:all .15s;position:relative;}
.sl-btn:after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;}
.sl-btn:hover,.sl-btn.active{border-color:var(--accent);color:var(--text);}
.sl-btn.active{color:var(--accent);background:rgba(30,136,229,.08);}
.sl-drop{position:absolute;top:calc(100% + 4px);left:0;min-width:210px;background:#ffffff;
  border:1px solid var(--border2);border-radius:8px;z-index:9999;display:none;
  flex-direction:column;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:320px;overflow:hidden;}
.sl-drop.open{display:flex;}
.sl-search{padding:8px;border-bottom:1px solid var(--border);}
.sl-search input{width:100%;background:var(--bg);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);padding:5px 8px;font-size:11px;font-family:var(--font);outline:none;}
.sl-search input:focus{border-color:var(--accent);}
.sl-list{overflow-y:auto;max-height:220px;}
.sl-item{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;}
.sl-item:hover{background:rgba(30,136,229,.07);}
.sl-item input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0;pointer-events:none;}
.sl-item label{cursor:pointer;font-size:11px;color:var(--muted2);pointer-events:none;}
.sl-item:hover label{color:var(--text);}
.clear-btn{background:none;border:1px solid var(--border2);color:var(--muted);
  border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;font-family:var(--font);}
.clear-btn:hover{border-color:var(--red);color:var(--red);}

/* ─ KPI CARDS ─ */
.kpi-strip{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--border);}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;position:relative;overflow:hidden;}
.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:8px 8px 0 0;}
.kpi.cb:before{background:var(--accent);}
.kpi.cg:before{background:var(--green);}
.kpi.cr:before{background:var(--red);}
.kpi.cp:before{background:var(--purple);}
.kpi-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.kpi-val{font-size:16px;font-weight:700;font-family:var(--mono);}
.kpi-val.cb{color:var(--accent);}
.kpi-val.cg{color:var(--green);}
.kpi-val.cr{color:var(--red);}
.kpi-val.cp{color:var(--purple);}

/* ─ TABS ─ */
.tabs-bar{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.tab-btn{padding:9px 16px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;
  border:none;background:none;font-family:var(--font);border-bottom:2px solid transparent;
  white-space:nowrap;transition:all .15s;text-transform:uppercase;letter-spacing:.4px;}
.tab-btn:hover{color:var(--muted2);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ─ MAIN SCROLL AREA ─ */
.page-wrap{display:flex;flex-direction:column;height:100%;}
.main{flex:1;overflow-y:auto;padding:14px 20px 24px;}

/* ─ PLACEHOLDER PAGE ─ */
.placeholder-page{display:flex;align-items:center;justify-content:center;height:100%;min-height:400px;}
.placeholder-content{text-align:center;}
.placeholder-icon{font-size:48px;margin-bottom:16px;}
.placeholder-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;}
.placeholder-text{font-size:13px;color:var(--muted);line-height:1.5;}

/* ─ CHARTS ─ */
.charts-grid{display:grid;gap:12px;margin-bottom:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g1{grid-template-columns:1fr;}
.ch-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;}
.ch-title{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:10px;}
.ch-wrap{position:relative;height:280px;}

#summaryLabel{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
  padding:5px 20px;display:flex;flex-direction:row;align-items:center;gap:8px;}
#summaryLabel span{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- MAIN NAVIGATION (3 sections) -->
  <div class="main-nav">
    <div class="nav-title">📊 CarTrade Operations</div>
    <div class="main-sections">
      <button class="main-sec-btn" data-section="recruitment">Recruitment</button>
      <button class="main-sec-btn" data-section="hr-ops">HR Operations</button>
      <button class="main-sec-btn active" data-section="training">Training</button>
    </div>
  </div>

  <!-- SUB-TABS -->
  <div class="sub-tabs" id="subTabs"></div>

  <!-- HEADER -->
  <div class="hdr" id="hdr">
    <div class="hdr-left">
      <div class="hdr-icon">🎓</div>
      <div>
        <div class="hdr-title" id="hdrTitle">New Hire Training</div>
        <div class="hdr-sub" id="hdrSub">Analytics Dashboard</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="badge-pill" id="rcBadge">— rows</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="status-dot" id="liveStatus"></div>
        <span style="font-size:11px;color:var(--muted2)" id="srcLabel">Loading</span>
      </div>
    </div>
  </div>

  <!-- FETCH STATUS -->
  <div class="fetch-bar" id="fetchBar">
    <span id="fetchStatus">⏳ Fetching live data from Google Sheets…</span>
  </div>

  <!-- TABS BAR (for Training → New Hire Training only) -->
  <div class="tabs-bar" id="tabsBar" style="display:none;">
    <button class="tab-btn active" data-tab="batch">Batches</button>
    <button class="tab-btn" data-tab="trng">Training Schedule</button>
    <button class="tab-btn" data-tab="pkt">Quality PKT Certification</button>
    <button class="tab-btn" data-tab="kra">KRA Certification</button>
    <button class="tab-btn" data-tab="exits">Exits — Training Phase</button>
    <button class="tab-btn" data-tab="ojt">OJT Phase Schedule</button>
  </div>

  <!-- SLICERS (for Training → New Hire Training only) -->
  <div class="slicers" id="slicersBar" style="display:none;">
    <button class="clear-btn" id="clearAllBtn">✕ Clear All</button>
  </div>

  <!-- SUMMARY LABEL -->
  <div id="summaryLabel" style="display:none;">
    <span>● Overall Summary</span>
  </div>

  <!-- KPI STRIP -->
  <div class="kpi-strip" id="kpiStrip" style="display:none;"></div>

  <!-- MAIN CONTENT AREA -->
  <div class="main" id="mainArea"></div>

</div>

<script>
Chart.register(ChartDataLabels);

// ═══════════════════════════════════════════════════════════
//  GOOGLE SHEET CSV CONFIGURATION
// ═══════════════════════════════════════════════════════════
const SID = '1jEqlfONZV3HrYTCQYhCyoucDS2LcUKfPEMLkC3m1B-0';
const GID = '2099952935';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SID}/export?format=csv&gid=${GID}`;

// ═══════════════════════════════════════════════════════════
//  STATE & INITIALIZATION
// ═══════════════════════════════════════════════════════════
let currentSection = 'training';
let currentSubTab = 'new-hire-training';
let currentTab = 'batch';
let DATA = [];
const chartInst = {};

// Section definitions
const SECTIONS = {
  recruitment: {
    name: 'Recruitment',
    icon: '💼',
    subTabs: [
      {id: 'open-positions', label: 'Open Positions'},
      {id: 'hiring-funnel', label: 'Hiring Funnel'}
    ]
  },
  'hr-ops': {
    name: 'HR Operations',
    icon: '👥',
    subTabs: [
      {id: 'attrition', label: 'Attrition'},
      {id: 'manpower-count', label: 'Manpower Count'}
    ]
  },
  training: {
    name: 'Training',
    icon: '🎓',
    subTabs: [
      {id: 'new-hire-training', label: 'New Hire Training'},
      {id: 'ld', label: 'L&D'},
      {id: 'gurukul', label: 'Gurukul'}
    ]
  }
};

const SLICER_KEYS = ['Batches','Process','Trainer Name','Status','Batch Type','Month'];
const SLICER_LABELS = {'Batches':'Batches','Process':'Process','Trainer Name':'Trainer Name','Status':'Status','Batch Type':'Batch Type','Month':'Month'};
const slicerSel = {};
SLICER_KEYS.forEach(k => slicerSel[k] = new Set());

// ─ MAIN SECTION HANDLERS ─
document.querySelectorAll('.main-sec-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.main-sec-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentSection = this.dataset.section;
    currentSubTab = SECTIONS[currentSection].subTabs[0].id;
    renderSubTabs();
    renderPage();
  });
});

// ─ TAB HANDLERS ─
document.addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderTab();
}, true);

// ═══════════════════════════════════════════════════════════
//  SUB-TAB RENDERING
// ═══════════════════════════════════════════════════════════
function renderSubTabs() {
  const subTabsBar = document.getElementById('subTabs');
  const section = SECTIONS[currentSection];
  
  subTabsBar.innerHTML = section.subTabs.map(tab => 
    `<button class="sub-tab-btn ${tab.id === currentSubTab ? 'active' : ''}" data-subtab="${tab.id}">${tab.label}</button>`
  ).join('');
  
  subTabsBar.querySelectorAll('.sub-tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      subTabsBar.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentSubTab = this.dataset.subtab;
      renderPage();
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  PAGE RENDERING
// ═══════════════════════════════════════════════════════════
function renderPage() {
  const section = SECTIONS[currentSection];
  const subTabLabel = section.subTabs.find(t => t.id === currentSubTab)?.label || '';
  document.getElementById('hdrTitle').textContent = `${section.name} — ${subTabLabel}`;
  
  const isNHT = currentSection === 'training' && currentSubTab === 'new-hire-training';
  document.getElementById('tabsBar').style.display = isNHT ? 'flex' : 'none';
  document.getElementById('slicersBar').style.display = isNHT ? 'flex' : 'none';
  document.getElementById('summaryLabel').style.display = isNHT ? 'flex' : 'none';
  document.getElementById('kpiStrip').style.display = isNHT ? 'grid' : 'none';
  document.getElementById('fetchBar').style.display = isNHT ? 'flex' : 'none';
  
  if (isNHT && DATA.length > 0) {
    renderTab();
  } else if (isNHT) {
    document.getElementById('mainArea').innerHTML = '<div class="placeholder-page"><div class="placeholder-content"><div class="placeholder-icon">⏳</div><div class="placeholder-title">Loading Data...</div></div></div>';
  } else {
    showPlaceholder(section.name, subTabLabel);
  }
}

function showPlaceholder(sectionName, subTabName) {
  document.getElementById('mainArea').innerHTML = `
    <div class="placeholder-page">
      <div class="placeholder-content">
        <div class="placeholder-icon">🚀</div>
        <div class="placeholder-title">${sectionName} — ${subTabName}</div>
        <div class="placeholder-text">Dashboard setup in progress.<br>Please check back soon!</div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  CSV PARSING & DATA LOADING
// ═══════════════════════════════════════════════════════════
function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        row.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    row.push(current);
    result.push(row);
  }
  return result;
}

async function fetchData() {
  const bar = document.getElementById('fetchBar');
  const status = document.getElementById('fetchStatus');
  const srcLbl = document.getElementById('srcLabel');
  
  try {
    console.log('🔍 Fetching from:', CSV_URL);
    status.textContent = '⏳ Fetching live data from Google Sheets…';
    
    const resp = await fetch(CSV_URL, { method: 'GET', mode: 'cors' });
    
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    
    const text = await resp.text();
    const rows = parseCSV(text);
    
    if (rows.length < 5) {
      throw new Error('Sheet is empty or missing data');
    }
    
    // Row 0 = Categories, Row 1 = Groups, Row 2 = Headers, Row 3 = Totals, Row 4+ = Data
    const headers = rows[2];
    const dataRows = rows.slice(4);
    
    DATA = dataRows
      .filter(row => row.length > 5 && row[0] && row[0].trim())
      .map(row => {
        const obj = {};
        headers.forEach((header, i) => {
          obj[header.trim()] = (row[i] || '').trim();
        });
        return obj;
      });
    
    console.log('✅ Data loaded:', DATA.length, 'rows');
    
    status.textContent = `✅ Live data loaded — ${DATA.length} rows from Google Sheets`;
    status.style.color = 'var(--green)';
    srcLbl.textContent = 'Live';
    srcLbl.style.color = 'var(--green)';
    document.getElementById('liveStatus').style.background = 'var(--green)';
    setTimeout(() => { bar.style.display = 'none'; }, 3000);
    
    buildSlicers();
    renderPage();
  } catch(e) {
    console.error('❌ Fetch error:', e.message);
    status.textContent = `⚠️ Failed to load live data: ${e.message}`;
    status.style.color = 'var(--yellow)';
    srcLbl.textContent = 'Error';
    srcLbl.style.color = 'var(--red)';
    document.getElementById('liveStatus').style.background = 'var(--red)';
    document.getElementById('mainArea').innerHTML = '<div class="placeholder-page"><div class="placeholder-content"><div class="placeholder-icon">❌</div><div class="placeholder-title">Data Load Error</div><div class="placeholder-text">' + e.message + '</div></div></div>';
  }
}

// ═══════════════════════════════════════════════════════════
//  SLICERS
// ═══════════════════════════════════════════════════════════
function getFiltered() {
  return DATA.filter(r => SLICER_KEYS.every(k => !slicerSel[k].size || slicerSel[k].has(r[k])));
}

function buildSlicers() {
  const bar = document.getElementById('slicersBar');
  const clearBtn = document.getElementById('clearAllBtn');
  
  while (bar.firstChild !== clearBtn) {
    bar.removeChild(bar.firstChild);
  }

  SLICER_KEYS.forEach(key => {
    let vals = [...new Set(DATA.map(r => r[key]).filter(v => v != null && v !== ''))];
    vals.sort();

    const id = 'sl_' + key.replace(/\W/g,'_');
    const wrap = document.createElement('div');
    wrap.className = 'sl-wrap';
    wrap.innerHTML = `
      <button class="sl-btn" id="sbtn_${id}">${SLICER_LABELS[key]}</button>
      <div class="sl-drop" id="sdrop_${id}">
        <div class="sl-search"><input type="text" placeholder="Search…" id="ssrch_${id}"></div>
        <div class="sl-list" id="slist_${id}">
          ${vals.map(v => `<div class="sl-item" data-key="${key}" data-id="${id}"><input type="checkbox"><label>${v}</label></div>`).join('')}
        </div>
      </div>`;
    bar.insertBefore(wrap, clearBtn);
  });

  document.getElementById('slicersBar').addEventListener('click', e => {
    const btn = e.target.closest('.sl-btn');
    if (btn) {
      const id = btn.id.replace('sbtn_','');
      const dd = document.getElementById('sdrop_' + id);
      closeAllDrops();
      dd.classList.add('open');
      return;
    }
    const item = e.target.closest('.sl-item');
    if (item) {
      const key = item.dataset.key, id = item.dataset.id;
      const cb = item.querySelector('input');
      const val = item.querySelector('label').textContent;
      cb.checked = !cb.checked;
      if (cb.checked) slicerSel[key].add(val); else slicerSel[key].delete(val);
      updateBtn(key, id); refresh();
    }
    if (e.target.closest('#clearAllBtn')) clearAll();
  });

  document.getElementById('slicersBar').addEventListener('input', e => {
    const inp = e.target;
    if (!inp.id || !inp.id.startsWith('ssrch_')) return;
    const listId = 'slist_' + inp.id.replace('ssrch_','');
    const q = inp.value.toLowerCase();
    document.querySelectorAll(`#${listId} .sl-item`).forEach(item => {
      item.style.display = item.querySelector('label').textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.sl-wrap')) closeAllDrops();
  });
}

function closeAllDrops() {
  document.querySelectorAll('.sl-drop.open').forEach(d => d.classList.remove('open'));
}

function updateBtn(key, id) {
  const btn = document.getElementById('sbtn_' + id);
  const sel = slicerSel[key];
  const lbl = SLICER_LABELS[key];
  btn.textContent = sel.size === 0 ? lbl : sel.size === 1 ? [...sel][0] : `${lbl} (${sel.size})`;
  sel.size > 0 ? btn.classList.add('active') : btn.classList.remove('active');
}

function clearAll() {

// ═══════════════════════════════════════════════════════════
//  HELPERS & CHART UTILITIES
// ═══════════════════════════════════════════════════════════
function fmt(v,f='p'){
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(f==='p') return (v*100).toFixed(1)+'%';
  if(f==='n') return Math.round(v).toLocaleString();
  return Number(v).toFixed(2);
}

function groupBy(data,gk,vk,agg='wavg',wk='Headcount (Day 0)'){
  const g={};
  data.forEach(r=>{
    const k=r[gk]||'?';
    if(!g[k])g[k]={v:[],w:[]};
    const v=parseFloat(r[vk]);
    if(v!=null&&!isNaN(v)){
      g[k].v.push(v);
      g[k].w.push(parseFloat(r[wk])||1);
    }
  });
  const res={};
  for(const[k,{v,w}]of Object.entries(g)){
    if(!v.length){res[k]=null;continue;}
    if(agg==='sum')res[k]=v.reduce((a,b)=>a+b,0);
    else{
      const d=w.reduce((a,b)=>a+b,0);
      res[k]=d?v.reduce((s,x,i)=>s+x*w[i],0)/d:null;
    }
  }
  return res;
}

const CC = {muted:'#5f6368',border:'#d1dce6',
  pal:['#1e88e5','#00c853','#7c4dff','#fbc02d','#d32f2f','#f57c00','#0097a7','#6a1b9a']};

function gc(i){return CC.pal[i%CC.pal.length];}

function mkChart(id,type,labels,datasets,opts={}){
  if(chartInst[id]){chartInst[id].destroy();delete chartInst[id];}
  const el=document.getElementById(id); if(!el) return;
  const isPct=opts.isPct!==false;
  const isCount=opts.isCount===true;
  const exDL=opts.datalabelsFmt;
  const baseFmt=v=>{if(v==null||v===undefined) return '';return isPct?(v*100).toFixed(0)+'%':Number(v).toFixed(0);};
  const scaleY=isPct?{ticks:{color:CC.muted,font:{size:9},callback:v=>(v*100).toFixed(0)+'%'},grid:{color:'rgba(209,220,230,.3)'},border:{color:CC.border}}
    :{ticks:{color:CC.muted,font:{size:9},callback:v=>isCount?v.toLocaleString():v},grid:{color:'rgba(209,220,230,.3)'},border:{color:CC.border}};
  chartInst[id]=new Chart(el.getContext('2d'),{
    type,data:{labels,datasets},plugins:[ChartDataLabels],
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:datasets.length>1,labels:{color:CC.muted,font:{size:10},boxWidth:10,padding:8}},
        tooltip:{callbacks:{label:ctx=>{const v=ctx.parsed.y??ctx.parsed;return isPct&&typeof v==='number'?` ${(v*100).toFixed(1)}%`:` ${typeof v==='number'?v.toLocaleString():v}`;}}},
        datalabels:{display:false,color:'#ffffff',font:{size:9,weight:'600',family:'"JetBrains Mono",monospace'},
          anchor:'end',align:'top',offset:2,clip:false,formatter:exDL||baseFmt},
      },
      scales:(type==='bar'||type==='line')?{
        x:{ticks:{color:CC.muted,font:{size:9},maxRotation:38},grid:{color:'rgba(209,220,230,.4)'},border:{color:CC.border}},
        y:scaleY}:undefined,
      layout:{padding:{top:4,right:6}},
      ...(opts.extraOpts||{}),
    }
  });
}

function refresh() {
  const filtered = getFiltered();
  renderKPIStrip(filtered);
  renderTab();
}

// ═══════════════════════════════════════════════════════════
//  KPI STRIP
// ═══════════════════════════════════════════════════════════
function renderKPIStrip(data) {
  const totalHC = data.reduce((s,r) => s+(parseFloat(r['Headcount (Day 0)'])||0),0);
  const totalEnd = data.reduce((s,r) => s+(parseFloat(r['Count -Trng end'])||0),0);
  const totalAttr = data.reduce((s,r) => s+(parseFloat(r['Total Attrition'])||0),0);
  const bCount = new Set(data.map(r=>r['Batches'])).size;
  
  function wavg(f){
    let n=0,d=0;
    data.forEach(r=>{
      const w=parseFloat(r['Headcount (Day 0)'])||0;
      const v=parseFloat(r[f]);
      if(v!=null&&!isNaN(v)){n+=v*w;d+=w;}
    });
    return d?n/d:null;
  }
  
  const kpis = [
    {l:'Total Batches',v:bCount,f:'n',c:'cb'},
    {l:'Total Headcount (Day 0)',v:totalHC,f:'n',c:'cb'},
    {l:'Total Training End HC',v:totalEnd,f:'n',c:'cg'},
    {l:'Total Attrition',v:totalAttr,f:'n',c:'cr'},
    {l:'Avg Conversion %',v:wavg('Conversion(Training start to end) %'),f:'p',c:'cg'},
    {l:'Avg PKT Cert %',v:wavg('PKT Certification %'),f:'p',c:'cp'},
  ];
  
  document.getElementById('kpiStrip').innerHTML = kpis.map(k => `
    <div class="kpi ${k.c}">
      <div class="kpi-lbl">${k.l}</div>
      <div class="kpi-val ${k.c}">${fmt(k.v,k.f)}</div>
    </div>`).join('');
  document.getElementById('rcBadge').textContent = data.length + ' rows';
}

function renderTab() {
  const filtered = getFiltered();
  const main = document.getElementById('mainArea');
  
  switch(currentTab) {
    case 'batch': tabBatch(main, filtered); break;
    case 'trng': tabTrng(main, filtered); break;
    case 'pkt': tabPKT(main, filtered); break;
    case 'kra': tabKRA(main, filtered); break;
    case 'exits': tabExits(main, filtered); break;
    case 'ojt': tabOJT(main, filtered); break;
    default: tabBatch(main, filtered);
  }
}

// TAB 1: BATCHES
function tabBatch(main,data){
  main.innerHTML=`
    <div class="charts-grid g2">
      <div class="ch-card"><div class="ch-title">Headcount by Process</div><div class="ch-wrap"><canvas id="c1"></canvas></div></div>
      <div class="ch-card"><div class="ch-title">Headcount by Trainer</div><div class="ch-wrap"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="charts-grid g2">
      <div class="ch-card"><div class="ch-title">Status Distribution</div><div class="ch-wrap"><canvas id="c3"></canvas></div></div>
      <div class="ch-card"><div class="ch-title">Batches by Month</div><div class="ch-wrap"><canvas id="c4"></canvas></div></div>
    </div>
    `;
  const hcP=groupBy(data,'Process','Headcount (Day 0)','sum');
  const pl=Object.keys(hcP).slice(0,14);
  mkChart('c1','bar',pl,[{data:pl.map(l=>hcP[l]),backgroundColor:'rgba(30,136,229,.7)',borderWidth:0,borderRadius:6}],{isPct:false,isCount:true});
  const hcT=groupBy(data,'Trainer Name','Headcount (Day 0)','sum');
  const tl=Object.keys(hcT);
  mkChart('c2','bar',tl,[{data:tl.map(l=>hcT[l]),backgroundColor:'rgba(167,139,250,.7)',borderWidth:0,borderRadius:6}],{isPct:false,isCount:true});
  const sc={};data.forEach(r=>{const s=r['Status']||'?';sc[s]=(sc[s]||0)+1;});
  mkChart('c3','doughnut',Object.keys(sc),[{data:Object.values(sc),backgroundColor:CC.pal.slice(0,Object.keys(sc).length).map(c=>c+'bb'),borderColor:'transparent',borderWidth:0}],{isPct:false});
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const validMonths=months.filter(m=>data.some(r=>r['Month']===m));
  const mc={};data.forEach(r=>{if(r['Month'])mc[r['Month']]=(mc[r['Month']]||0)+1;});
  mkChart('c4','bar',validMonths,[{data:validMonths.map(m=>mc[m]||0),backgroundColor:'rgba(0,200,83,.7)',borderWidth:0,borderRadius:6}],{isPct:false,isCount:true});
}
